  - epic: 15
    action: "TD (review 15.2, rilievo di EPIC non di story): l'app non dichiara `viewport-fit=cover` in nessun layout (grep a zero), quindi TUTTI gli `env(safe-area-inset-*)` introdotti dall'epic valgono 0 e sono inerti: tab bar e toast-host della 15.1, riga `.so-actions` della 15.2. Oggi innocui, ma la convenzione non fa nulla e una futura verifica su iPhone con notch la troverebbe non applicata. Decidere in 15.10 (sweep finale): o si aggiunge `viewport-fit=cover` al meta viewport e si verifica il layout su un device con inset reali, o si rimuovono gli `env()` come rumore. NON va deciso a occhio su Chromium headless, che ha inset 0."
