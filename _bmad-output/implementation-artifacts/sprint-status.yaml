  - epic: 15
    action: "TD (osservato nell'arbitro della 15.3, PRE-esistente): `billing.spec.ts:296` e' flaky sotto `fullyParallel` — `depositsTotalAfter - depositsTotalBefore` ha letto 5000 invece di 10000 (retry verde, exit 0). E' un delta-assert su un aggregato GLOBALE (totale Acconti): la mitigazione 'delta invece di fotografia' prescritta da CLAUDE.md NON basta quando l'aggregato e' globale e altre spec creano ricariche dentro la stessa finestra. Rimedio: spostarlo nel project serializzato `billing-global` (dove vive gia' il gemello della stessa classe) oppure filtrare l'aggregato sulla persona run-unique dello scenario. Non attribuibile alla 15.3: le sue spec non creano movimenti di denaro (verificato)."
    owner: "backlog TD"
