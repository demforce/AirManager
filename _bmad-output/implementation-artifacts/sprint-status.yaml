  - epic: 15
    action: "TD (emerso in 15.3, PRE-esistente e non causato li'): il picker Velivolo del registro voli e' un `<select>` seminato con `OPTIONS_PAGE_SIZE = 100` (logbook/page.tsx:32; stessa costante anche in dashboard/page.tsx, bookings/page.tsx, billing/page.tsx) — oltre 100 velivoli in anagrafica l'ultimo creato NON e' piu' selezionabile. Ha ucciso 4 e2e su DB saturo (flight-log:289, flight-reversal:161, flights:483, reports:206). Misura di questa sessione: UNA sola suite completa porta il DB a 104 velivoli, cioe' il run successivo sullo stesso DB parte gia' oltre il tetto. Il rimedio esiste GIA' in casa e non e' stato applicato a questo picker: il typeahead server-side della story TD-3, che il picker persone della STESSA pagina usa (guardato da typeahead-pickers.spec.ts:37). Su un'aviosuperficie reale il tetto e' lontano; per la suite e' un fucile carico."
    owner: "backlog TD"
