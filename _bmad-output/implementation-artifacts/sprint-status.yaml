action_items:
  - epic: 15
    action: "STORY DEDICATA post-Epic-15 (decisione PO 2026-07-31, opzione 2 di 3): l'AOG di un velivolo non protegge ne' le prenotazioni gia' prese ne' la registrazione dei voli. FATTI MISURATI sul codice: `setOutOfService` (aircraft.service.ts:393-416) scrive SOLO la riga del velivolo (status + statusReason, con guardia atomica) e non tocca MAI la tabella Booking - nessun annullamento, nessuna email, nessun flag. I blocchi esistono in tre punti soli, tutti 422 AIRCRAFT_OUT_OF_SERVICE col motivo: creazione (bookings.service.ts:554), spostamento SU quel velivolo anche per admin (:903) e APPROVAZIONE di una PENDING (:1132, dentro transitionBooking, che rifa' i controlli di creazione). Ne esce un'asimmetria: una PENDING e' di fatto congelata e l'admin capisce perche', mentre una APPROVED sopravvive INTATTA e MUTA - il pilota si presenta al campo e trova il velivolo fermo, senza che l'app glielo abbia mai detto. L'unico segnale oggi e' visivo e solo desktop (il blocco AOG disegnato sulla riga della timeline, sopra le prenotazioni ancora in piedi). Inoltre flights.service.ts:496 carica il velivolo selezionando id/registration/archivedAt e NON LEGGE NEMMENO `status`: un volo su un velivolo fuori servizio si registra senza alcun ostacolo (le uniche 3 occorrenze di AIRCRAFT_OUT_OF_SERVICE in tutto il codice sono in bookings.service.ts). Storicamente coerente - il commento aircraft.service.ts:391 dice 'il vero blocco arriva con l'Epic 7', e l'Epic 7 ha coperto le prenotazioni, non i voli. REQUISITI FISSATI DAL PO, non ridiscutibili: (1) quando l'admin mette un velivolo in AOG, l'avviso che esistono X prenotazioni per quel velivolo deve essere SUBITO VISIVO - non un dato da andare a cercare; (2) guardia sulla REGISTRAZIONE DEL VOLO per un velivolo fuori servizio; (3) DATA DI RIENTRO PREVISTO sull'AOG ('AOG fino al ...', PO 2026-07-31) - e' il campo che rende azionabile il requisito (1): senza, 'X prenotazioni impattate' vale 'tutte quelle future, per sempre' e nessuno ci fa niente; con, il conteggio si spacca in 'prima del rientro previsto = da gestire' e 'dopo = probabilmente ok'. Risponde anche alla domanda che il pilota fa per seconda ('quando torna?'), oggi affidata al testo libero di statusReason quando qualcuno si ricorda di scriverla. DUE INVARIANTI DA RISPETTARE, decisi con la (3): [a] la data non rimette MAI il velivolo in servizio da sola - un aeromobile e' aeronavigabile quando lo dichiara una persona, non quando scade un timestamp; un rientro automatico farebbe ripassare i controlli a un velivolo ancora smontato. La data e' INFORMATIVA (avvisi, conteggi, messaggi), il rientro resta `returnToService` esplicito; [b] il campo e' OPZIONALE: un AOG non programmato in attesa di un pezzo non ha una data, e renderla obbligatoria produce date inventate - meglio 'rientro da definire' con il conteggio dichiarato non delimitato. Modello: `outOfServiceUntil DateTime?` con lo stesso ciclo di vita di `statusReason` (scritto col motivo, azzerato al rientro, regola nel service non a livello DB); l'app sa gia' confrontare una data col giorno del volo (7.4/14.4) e ha `date-only.ts`. Costo largo ma meccanico: `statusReason` affiora gia' in >=6 superfici (opzione del form prenotazione, aircraft-editor, timeline, card flotta, panoramica) e la data viaggia sugli stessi percorsi. Quasi gratis: il 422 porta gia' `details.reason` e puo' portare la data, trasformando 'fuori servizio' in 'rientro previsto il 12/08' - stessa medicina di R-15.4-g. DA RATIFICARE nella story: se la guardia sul volo sia un blocco secco o una deroga admin motivata sul modello di `flights.forceExpiry` (forceReason obbligatorio + tracciamento, precedente 14.4); quale finestra temporale conta per le X prenotazioni quando la data manca; se avvisare anche i piloti coinvolti (email) o solo l'admin - il PO ha detto 'admin', ma il caso che fa male e' il pilota che si presenta al campo. Materiale gia' pronto: `listOutOfServiceAircraft` (aircraft.service.ts:202-215) esiste gia'. NON assegnata alla 15.4: fuori dal suo perimetro ratificato, e la parte volo e' backend."
    owner: "story dedicata post-Epic 15"
