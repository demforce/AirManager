  - epic: 15
    action: "TD (rilevato dalla review 15.3, fragilita' PRE-esistente): `home-dashboard.spec.ts:228` cerca la propria fixture dentro la finestra di 8 righe della card della home, ordinata per startsAt sulle ultime 48h — su DB popolato la fixture non ci sta. E' la stessa trappola 'fotografia + uguaglianza' (review Billing-2 F4) che il dev della 15.3 ha dovuto togliere dai propri due test, e che li' e' stata curata rileggendo il dato dall'API filtrata su una fixture run-unique. Applicare la stessa medicina. NB: nell'arbitro su DB fresco il test passa — la fragilita' e' latente, non attiva."
