name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # src/lib/env.ts validates these eagerly (Zod) at build/import time.
      # Dummy values only — nothing in lint/typecheck/unit-test/build opens a
      # real DB connection (verified: build passes with a dead port).
      DATABASE_URL: postgresql://ci:ci@localhost:59999/ci?schema=public
      AUTH_SECRET: ci-dummy-secret-not-used-anywhere
      SEED_ADMIN_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:quiet

      # Unit tests run with environment 'node' and no DB (vitest.config.ts),
      # so no Postgres service is needed here — the e2e job has its own.
      # No .env in CI, so NODE_ENV is unset and plain `next build` is correct.
      - name: Build
        run: npm run build

  e2e:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: e2e
            mode: normal
            email_trial: "0"
          - check: e2e (email trial)
            mode: trial
            email_trial: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airmanager
          POSTGRES_PASSWORD: airmanager
          POSTGRES_DB: airmanager_test
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U airmanager -d airmanager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025
    env:
      DATABASE_URL: postgresql://airmanager:airmanager@localhost:55432/airmanager_test?schema=public
      AIRMANAGER_EMAIL_TRIAL: ${{ matrix.email_trial }}
      APP_URL: http://localhost:3000
      TEST_DATABASE_URL: postgresql://airmanager:airmanager@localhost:55432/airmanager_test?schema=public
      # Story 17.1 — documents the env contract only; equals the code
      # default (src/lib/env.ts), so CI behaviour is unchanged.
      DATABASE_POOL_MAX: 10
      AUTH_SECRET: ci-e2e-secret-not-used-anywhere-0123456789
      # Specs and seed both read this from env (see .env.example); dummy value.
      SEED_ADMIN_PASSWORD: ChangeMe123!
      # Optional in envSchema but required by the jobs e2e suite: the route
      # answers 500 when unset, and expiry-alerts.spec.ts exercises the guard.
      JOBS_SECRET: ci-jobs-secret
      # The e2e job tests the production build (next start): Auth.js v5 only
      # auto-trusts the host in development, so localhost must be trusted
      # explicitly here or every /api/auth call fails with UntrustedHost.
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed database
        run: npx prisma migrate deploy && npx prisma db seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Complete normal-mode browser regression
        if: matrix.mode == 'normal'
        run: npm run test:e2e

      - name: Email-trial browser contracts
        if: matrix.mode == 'trial'
        run: npm run test:e2e -- --grep @email-trial --no-deps --workers=1

      - name: Security recipient readiness on a fresh disposable database
        if: matrix.mode == 'trial'
        run: |
          npm run db:reset:test
          node --import tsx --test scripts/test-access-security.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.mode }}
          path: test-results/
          retention-days: 7
